name: Release notes

# MVP volontairement manuel : pas de déclenchement automatique.
# Pourra être étendu plus tard, par ex. :
#   on:
#     push:
#       tags:
#         - 'v*'
on:
  workflow_dispatch:
    inputs:
      from_ref:
        description: >-
          Ref/tag de départ (exclu). Laisser vide pour utiliser automatiquement le dernier tag
          avant to_ref.
        required: false
        default: ''
      to_ref:
        description: 'Ref/tag de fin (inclus).'
        required: false
        default: 'HEAD'

permissions:
  contents: read

jobs:
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historique complet + tags)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Déterminer la plage de commits
        id: range
        run: |
          set -euo pipefail

          to_ref="${{ inputs.to_ref }}"
          from_ref="${{ inputs.from_ref }}"
          if [ -z "$to_ref" ]; then
            to_ref="HEAD"
          fi

          if ! git rev-parse --verify "${to_ref}^{commit}" >/dev/null 2>&1; then
            echo "::error::to_ref invalide ou introuvable : $to_ref"
            exit 1
          fi

          if [ -z "$from_ref" ]; then
            from_ref="$(git describe --tags --abbrev=0 "${to_ref}^" 2>/dev/null || true)"
            if [ -z "$from_ref" ]; then
              echo "::error::from_ref non fourni et aucun tag précédent trouvé automatiquement avant $to_ref — renseigner from_ref manuellement."
              exit 1
            fi
          elif ! git rev-parse --verify "${from_ref}^{commit}" >/dev/null 2>&1; then
            echo "::error::from_ref invalide ou introuvable : $from_ref"
            exit 1
          fi

          echo "from_ref=$from_ref" >> "$GITHUB_OUTPUT"
          echo "to_ref=$to_ref" >> "$GITHUB_OUTPUT"

      - name: Générer les release notes (script déterministe, pas d'appel API)
        run: |
          set -euo pipefail
          meta/automation/release-notes/generate.sh \
            "${{ steps.range.outputs.from_ref }}" "${{ steps.range.outputs.to_ref }}" \
            > release-notes.md

      - name: Publier l'artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-${{ steps.range.outputs.from_ref }}-${{ steps.range.outputs.to_ref }}
          path: release-notes.md
          if-no-files-found: error
